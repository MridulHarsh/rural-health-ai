name: rural_health_ai
description: Offline Multimodal AI Assistant for Rural Health Workers
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ML / TFLite
  tflite_flutter: ^0.12.0
  image: ^4.1.7            # Image decoding/resizing for ML inference

  # Voice Input (offline STT via Android native)
  speech_to_text: ^7.0.0

  # Camera / Image
  image_picker: ^1.0.7
  camera: ^0.12.0+1

  # UI Components
  cupertino_icons: ^1.0.6
  google_fonts: ^8.0.2
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  fl_chart: ^1.2.0
  percent_indicator: ^4.2.3

  # Storage
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  sqflite: ^2.3.2
  path: ^1.9.0

  # PDF Export
  pdf: ^3.10.8
  printing: ^5.12.0

  # Utilities
  intl: ^0.20.2                                # Pinned at 0.20 by Flutter 3.41.6; bumping requires a Flutter SDK bump too
  permission_handler: ^12.0.1
  uuid: ^4.3.3
  crypto: ^3.0.3                               # SHA-256 for FHIR encounter-hash provenance

  # ── New: competitive-parity features ──
  url_launcher: ^6.3.0                         # WhatsApp / SMS / tel intents for PHC handoff
  share_plus: ^12.0.2                          # System share sheet for FHIR bundle + analytics JSONL attachments (13.x blocked by Flutter 3.41.6)
  vibration: ^3.1.8                            # Emergency alarm on red-flag trigger
  encrypt: ^5.0.3                              # AES-256 at-rest encryption for PII
  flutter_secure_storage: ^10.0.0              # Key storage for encrypt
  google_mlkit_text_recognition: ^0.15.1       # OCR for prescription photos
  geolocator: ^14.0.2                          # Optional GPS stamp for outbreak clustering
  connectivity_plus: ^7.1.1                    # Online/offline detection for the Outbox queue (feature #4)
  flutter_local_notifications: ^21.0.0         # Local notification when signal returns + Outbox has pending (feature A1-full)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.0   # In-memory SQLite for unit tests (no device needed)

flutter:
  uses-material-design: true

  assets:
    - assets/models/

