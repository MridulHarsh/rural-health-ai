name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    # Job-level env so the `if:` on the Configure release signing step below
    # can read HAS_KEYSTORE reliably. A step-level env var is NOT visible to
    # that step's own `if:` condition (docs: expressions are evaluated before
    # the step's env block is materialized), so the previous pattern
    # `if: ${{ env.KEYSTORE_BASE64 != '' }}` was undefined-by-construction.
    # Computing once at the job level also avoids calling secrets.X in
    # multiple places.
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: android_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # CI only needs the current commit, not the full history — shallow
          # clone is ~30 % faster on this repo.
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Must match or exceed the dev machine's Flutter SDK. 3.41.x
          # is the first line that ships the Dart `intl 0.20.x` package
          # pubspec.yaml depends on — Flutter 3.24.5 (the earlier pin)
          # shipped intl 0.19.0 and failed pub get with a solver error.
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (errors + warnings fail the build; infos allowed per CLAUDE.md)
        run: flutter analyze --no-fatal-infos

      # Release signing — set up ONLY if the four signing secrets are
      # configured on the repo. When they're absent (e.g. fork builds, or
      # a fresh clone before secrets are added) we skip this step and the
      # Gradle config at android/app/build.gradle.kts falls through to
      # the debug keystore. See KEYSTORE_SETUP.md for the one-time
      # secret-generation walkthrough.
      - name: Configure release signing
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # Suppress command echo so env-var expansion in the HEREDOC below
          # never echoes passwords to the runner log. GitHub *does* redact
          # registered secret values by string-match, but `set +x` is
          # defence-in-depth for unusual chars or log post-processing.
          set +x
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          # Write keystore.properties with restricted permissions so any
          # subsequent step running with lower privileges can't read it.
          umask 077
          cat > android/keystore.properties <<EOF
          storeFile=app/upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # split-per-abi produces three smaller APKs (armeabi-v7a, arm64-v8a,
      # x86_64) instead of one universal ~130 MB binary. Target phones only
      # need the one matching their CPU — the release workflow attaches all
      # three to the GitHub Release so downloaders pick whichever fits.
      - name: Build release APKs (split-per-abi)
        run: flutter build apk --release --split-per-abi

      - name: Verify APKs produced
        run: |
          dir=build/app/outputs/flutter-apk
          missing=0
          for abi in armeabi-v7a arm64-v8a x86_64; do
            apk="$dir/app-$abi-release.apk"
            if [ ! -f "$apk" ]; then
              echo "::error::Missing APK: $apk"
              missing=1
            else
              echo "  $apk ($(du -h "$apk" | cut -f1))"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            ls -R "$dir" || true
            exit 1
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: rural-health-ai-${{ github.sha }}
          path: android_app/build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
          retention-days: 30
