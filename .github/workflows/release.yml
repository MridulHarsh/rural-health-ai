name: Release

# Triggered when a `v*` tag is pushed (e.g. `v1.2.0`). Builds the three
# per-ABI release APKs and attaches them to an auto-created GitHub Release
# so downloaders (ASHA field sites, partner PHCs) can grab the smallest
# APK that matches their phone's CPU without downloading a 130 MB universal.
#
# Feature E3 in the NeuCure roadmap.
#
# SECURITY: no untrusted input flows into any `run:` command. The tag name
# reaches softprops/action-gh-release via the github context, which that
# action escapes internally; we don't interpolate it into shell anywhere.
on:
  push:
    tags:
      - 'v*'

permissions:
  # Required by softprops/action-gh-release to create the Release and
  # upload assets. All other permissions stay read-only.
  contents: write

jobs:
  release:
    name: Build + publish APKs
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: android_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run unit tests
        run: flutter test test/clinical_engine_test.dart test/handoff_queue_service_test.dart

      # Same signing dance as build-apk.yml — falls through to the debug
      # keystore when release secrets aren't configured. A release build
      # on an unsigned fork still produces installable APKs (just not
      # Play-Store-suitable ones).
      - name: Configure release signing
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set +x
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          umask 077
          cat > android/keystore.properties <<EOF
          storeFile=app/upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APKs (split-per-abi)
        run: flutter build apk --release --split-per-abi

      - name: Verify APKs produced
        run: |
          dir=build/app/outputs/flutter-apk
          for abi in armeabi-v7a arm64-v8a x86_64; do
            apk="$dir/app-$abi-release.apk"
            if [ ! -f "$apk" ]; then
              echo "::error::Missing APK: $apk"
              ls -R "$dir" || true
              exit 1
            fi
          done

      - name: Create GitHub Release + upload APKs
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            android_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            android_app/build/app/outputs/flutter-apk/app-x86_64-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
